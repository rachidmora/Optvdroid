name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AtvPlayer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Download Arabic subtitle font (Tajawal, OFL)
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fL --retry 3 -o app/src/main/assets/fonts/tajawal_bold.ttf https://github.com/google/fonts/raw/main/ofl/tajawal/Tajawal-Bold.ttf || echo "font download failed, using system font"
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AtvPlayer-debug-apk
          path: AtvPlayer/app/build/outputs/apk/debug/app-debug.apk
